<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimalTrack Login/Register</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .container {
    background: #fff;
    padding: 30px;
    border-radius: 10px;
    width: 400px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.1);
  }

  h2, h3 {
    text-align: center;
    color: #2c3e50;
  }

  input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
  }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background: #2c3e50;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1rem;
  }

  button:hover {
    background: #34495e;
  }

  .error {
    color: red;
    font-size: 0.9rem;
    text-align: center;
    margin-top: 5px;
  }

  .forgot {
    margin-top: 10px;
    text-align: center;
    font-size: 0.9rem;
    cursor: pointer;
    color: #2c3e50;
    text-decoration: underline;
  }

  hr {
    margin: 20px 0;
    border: none;
    border-top: 1px solid #ccc;
  }

  /* Modal */
  .modal {
    display: none;
    position: fixed;
    z-index: 2000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5);
  }

  .modal-content {
    background: #fff;
    margin: 10% auto;
    padding: 20px;
    border-radius: 8px;
    width: 90%;
    max-width: 400px;
    text-align: center;
    position: relative;
  }

  .close {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 1.5rem;
    cursor: pointer;
    color: #333;
  }
</style>
</head>
<body>

<div class="container">
  <!-- LOGIN FORM -->
  <h2>Login</h2>
  <input type="text" id="name" placeholder="Display Name">
  <input type="password" id="password" placeholder="Password">
  <input type="text" id="idNumber" placeholder="ID Number">
  <button id="loginBtn">Login</button>
  <p class="error" id="error-message"></p>
  <p class="forgot" id="forgotBtn">Forgot Password?</p>

  <hr>

  <!-- REGISTRATION FORM (ADMIN ONLY) -->
  <div id="registerContainer">
    <h3>Register New User</h3>
    <input type="text" id="regName" placeholder="First Name">
    <input type="email" id="regEmail" placeholder="Email">
    <input type="password" id="regPassword" placeholder="Password">
    <input type="text" id="role" placeholder="Role (Farmer, Vet, etc.)">
    <input type="text" id="farm" placeholder="Farm Name">
    <input type="text" id="regIDNumber" placeholder="ID Number">
    <button id="registerBtn">Register</button>
    <p class="error" id="register-error"></p>
  </div>
</div>

<!-- Forgot Password Modal -->
<div id="forgotModal" class="modal">
  <div class="modal-content">
    <span class="close" id="closeForgot">&times;</span>
    <h3>Reset Password</h3>
    <input type="email" id="fpEmail" placeholder="Email">
    <input type="text" id="fpID" placeholder="First 13 digits of ID">
    <input type="password" id="fpNewPassword" placeholder="New Password">
    <button id="resetBtn">Reset Password</button>
    <p class="error" id="fpError"></p>
  </div>
</div>

<script src="login.js"></script>
</body>
</html>
